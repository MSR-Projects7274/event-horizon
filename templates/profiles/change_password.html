{% extends "base.html" %}

{% block title %}Change Password | Event Horizon{% endblock %}

{% block content %}

<section class="profile-page">

    <div class="profile-header">

        <h1>Change Password</h1>

        <p>
            Choose a new password for your account.
        </p>

    </div>

    <div class="profile-form">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="profile-form-actions">

                <button
                    type="submit"
                    class="event-view-button"
                >
                    Change Password
                </button>

                <a
                    href="{% url 'profile' %}"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
