{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Event Horizon{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <nav>
            <a href="{% url 'home' %}">Event Horizon</a>

            <div>
                <a href="{% url 'event_list' %}">Explore</a>
                <a href="#">About</a>
                <a href="#">Login</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} Event Horizon</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
