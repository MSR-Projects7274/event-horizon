{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Event Horizon{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <nav class="main-nav">

            <div class="nav-brand">
                <a href="{% url 'home' %}">
                    Event Horizon
                </a>
            </div>

            <div class="nav-links">

                <a href="{% url 'event_list' %}">
                    Explore
                </a>

                <a href="#">
                    About
                </a>

            </div>

            <div class="nav-account">

                {% if user.is_authenticated %}

                    <div class="user-menu">

                        <span class="welcome-message">
                            Welcome, {{ user.username }}
                        </span>

                        <form
                            method="POST"
                            action="{% url 'logout' %}"
                            class="logout-form"
                        >
                            {% csrf_token %}

                            <button
                                type="submit"
                                class="logout-button"
                            >
                                Logout
                            </button>

                        </form>

                    </div>

                {% else %}

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                    <a href="{% url 'register' %}">
                        Register
                    </a>

                {% endif %}

            </div>

        </nav>

        <div class="site-search">
            <form method="GET" action="{% url 'event_list' %}">

                <div class="search-input-wrapper">
                    <input
                        type="search"
                        id="site-search-input"
                        name="q"
                        placeholder="Search events..."
                        value="{{ request.GET.q|default:'' }}"
                    >

                    <button type="submit">
                        Search
                    </button>
                </div>
            </form>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} Event Horizon</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
