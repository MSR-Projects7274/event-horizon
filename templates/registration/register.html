{% extends "base.html" %}

{% block title %}Create Account | Event Horizon{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <h1>Create Your Account</h1>

        <p>
            Create an account to book and manage your experiences.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-button">
                Create Account
            </button>
        </form>

        <p>
            Already have an account?

            <a href="{% url 'login' %}">
                Log in
            </a>
        </p>

    </div>

</section>

{% endblock %}
