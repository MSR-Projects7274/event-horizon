{% extends "base.html" %}

{% block title %}Login | Event Horizon{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Log in to manage your bookings and discover new experiences.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-button">
                Log In
            </button>
        </form>

    </div>

</section>

{% endblock %}
